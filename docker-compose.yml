# Local PostgreSQL for development. Credentials are for local use only.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: leadpilot
      POSTGRES_PASSWORD: leadpilot
      POSTGRES_DB: leadpilot
    ports:
      - "${POSTGRES_PORT:-5432}:5432" # set POSTGRES_PORT if 5432 is already in use
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadpilot"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
